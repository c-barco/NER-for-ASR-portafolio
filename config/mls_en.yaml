# Candidate 2 - Multilingual LibriSpeech English (NOT YET APPROVED).
# Laptop/HF route: streams parler-tts/mls_eng, a community mirror of OpenSLR 94 (test split 3,769 rows, ~0.25 GB parquet).
# Cluster route: use config/cluster_kaldi.yaml with the lecturer's MLS path instead.
run_name: mls_en_test_baseline
mode: pilot                 # pilot | full  (CLI --mode full overrides)
context_mode: none          # Step 2 baseline: never change
dataset:
  adapter: hf_mls_en
  name: mls_en
  language: en
  split: test               # official split; do not mix with train/validation
  revision: faf6604dcf0bb9ec0d9c280a140ad74da9c931b0
selection:
  target_hours: null        # PENDING: ~40 h requirement unclear (whole project vs baseline?)
  pilot_target_hours: 0.02
  pilot_max_items: 5
  seed: 42
  min_duration_s: 0.5
  max_duration_s: 30
  max_scan_items: 200       # pilot only: bounds the streamed download
  allow_insufficient: false
model:
  name: Qwen/Qwen3-ASR-1.7B-hf
  revision: bcd2b5b7f32b480ab5790554cfa8347f246a14f3
  dtype: auto               # bf16 on CUDA, fp32 on CPU
  device: auto
  language: English
  max_new_tokens: 256       # same as lecturer notebooks
  batch_size: 1
output_dir: results
