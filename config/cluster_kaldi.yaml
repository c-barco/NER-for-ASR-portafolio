# Optional local Kaldi route (``wav.scp`` + ``text``, TAB-separated).
# EuroSpeech is consumed directly from Hugging Face by the selected configs;
# this generic route is retained only if an authorised local mirror is supplied.
# It is not used for the Step 2 parquet export.
run_name: cluster_baseline
mode: pilot
context_mode: none
dataset:
  adapter: kaldi_dir
  name: eurospeech_en_local_mirror
  language: en
  split: test
  revision: null            # record the cluster snapshot/date you used
  path: data/raw/eurospeech_en_kaldi_test
selection:
  target_hours: null        # Set explicitly only for a full evaluation.
  pilot_target_hours: 0.02
  pilot_max_items: 5
  seed: 42
  min_duration_s: 0.5
  max_duration_s: 30
  allow_insufficient: false
model:
  name: ibm-granite/granite-4.0-1b-speech
  revision: bd87ab862416353633ea431fe49b1614003623c5
  dtype: auto
  device: auto
  language: en
  max_new_tokens: 200
  batch_size: 8
output_dir: results
