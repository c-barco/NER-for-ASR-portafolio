# Candidate 1 - VoxPopuli English (NOT YET APPROVED).
# Laptop/HF route: streams facebook/voxpopuli (needs the `datasets` package; parquet test split ~0.94 GB).
# Cluster route: use config/cluster_kaldi.yaml with the lecturer's VoxPopuli path instead.
run_name: voxpopuli_en_test_baseline
mode: pilot                 # pilot | full  (CLI --mode full overrides)
context_mode: none          # Step 2 baseline: never change
dataset:
  adapter: hf_voxpopuli
  name: voxpopuli_en
  language: en
  split: test               # official split; do not mix with train/validation
  revision: 42f01879c780b4a2e90ec0b4f616c2ece526e4f1
  options:
    config_name: en
    text_field: raw_text    # cased + punctuated; 'normalized_text' = lowercase variant
selection:
  target_hours: null        # PENDING: ~40 h requirement unclear (whole project vs baseline?)
  pilot_target_hours: 0.02
  pilot_max_items: 5
  seed: 42
  min_duration_s: 0.5
  max_duration_s: 30
  max_scan_items: 200       # pilot only: bounds the streamed download
  allow_insufficient: false
model:
  name: Qwen/Qwen3-ASR-1.7B-hf
  revision: bcd2b5b7f32b480ab5790554cfa8347f246a14f3
  dtype: auto               # bf16 on CUDA, fp32 on CPU
  device: auto
  language: English
  max_new_tokens: 256       # same as lecturer notebooks
  batch_size: 1
output_dir: results
